name: HGMF HG39 commissioning preflight

on:
  push:
    branches:
      - hgmf-hg39-commissioning-dossier-20261110
    paths:
      - 'research/hgmf-hg39/**'
      - '.github/workflows/hgmf-hg39-prearming.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  verify-prearming:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Compile and execute
        run: |
          cd research/hgmf-hg39
          python -m py_compile hgmf_hg39_fitness_compiler.py hgmf_hg39_commissioning_validator.py hgmf_hg39_exact_verify.py
          python hgmf_hg39_fitness_compiler.py HGMF_HG39_CURRENT_FITNESS_INPUT.json --output HGMF_HG39_CURRENT_FITNESS_OUTPUT.json
          python hgmf_hg39_commissioning_validator.py HGMF_HG39_CURRENT_DOSSIER.json --output HGMF_HG39_CURRENT_ADJUDICATION.json
          python hgmf_hg39_exact_verify.py | tee HGMF_HG39_VERIFY_OUTPUT.txt

      - name: Verify manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,hashlib
          root=Path('research/hgmf-hg39')
          rows=list(csv.DictReader((root/'HGMF_HG39_HASH_MANIFEST.csv').open()))
          for row in rows:
              p=root/row['file']
              assert p.exists(), row['file']
              b=p.read_bytes()
              assert len(b)==int(row['bytes'])
              assert hashlib.sha256(b).hexdigest()==row['sha256']
          print(f'manifest_verified={len(rows)}')
          PY

      - name: Package
        run: |
          cd research
          zip -r HGMF_HG39_COMMISSIONING_DOSSIER.zip hgmf-hg39

      - uses: actions/upload-artifact@v4
        with:
          name: HGMF_HG39_COMMISSIONING_DOSSIER
          path: research/HGMF_HG39_COMMISSIONING_DOSSIER.zip
          if-no-files-found: error
          retention-days: 30
