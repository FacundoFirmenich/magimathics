name: HGMF HG44 conformational e-process

on:
  push:
    branches:
      - hgmf-hg44-conformational-eprocess-20261111
    paths:
      - 'research/hgmf-hg44/payload_*.txt'
      - 'research/hgmf-hg44/materialize_hg44.py'
      - '.github/workflows/hgmf-hg44-conformational-eprocess.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  materialize-verify-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hgmf-hg44-conformational-eprocess-20261111
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Materialize canonical gate
        run: |
          python research/hgmf-hg44/materialize_hg44.py

      - name: Compile and execute exact verification
        run: |
          cd research/hgmf-hg44
          python -m py_compile hgmf_hg44_eprocess.py hgmf_hg44_exact_verify.py
          python hgmf_hg44_exact_verify.py | tee HGMF_HG44_VERIFY_OUTPUT.txt

      - name: Verify canonical manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib
          root=Path('research/hgmf-hg44')
          rows=list(csv.DictReader((root/'HGMF_HG44_HASH_MANIFEST.csv').open(encoding='utf-8')))
          for row in rows:
              p=root/row['file']
              assert p.exists(), row['file']
              b=p.read_bytes()
              assert len(b)==int(row['bytes']), row['file']
              assert hashlib.sha256(b).hexdigest()==row['sha256'], row['file']
          print(f'manifest_verified={len(rows)}')
          PY

      - name: Build canonical artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('research/hgmf-hg44')
          out=Path('/tmp/HGMF_HG44_CONFORMATIONAL_EPROCESS.zip')
          excluded={'materialize_hg44.py',*(f'payload_{i:02d}.txt' for i in range(6))}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.iterdir()):
                  if p.is_file() and p.name not in excluded and p.suffix!='.pyc':
                      z.write(p,arcname=f'HGMF_HG44_CONFORMATIONAL_EPROCESS/{p.name}')
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              print(f'artifact_files={len(z.namelist())}')
          PY

      - name: Persist expanded canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm research/hgmf-hg44/payload_*.txt research/hgmf-hg44/materialize_hg44.py
          git add research/hgmf-hg44
          git commit -m '[skip ci] HGMF-HG44: materialize canonical conformational gate'
          git push origin HEAD:hgmf-hg44-conformational-eprocess-20261111

      - name: Upload canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: HGMF_HG44_CONFORMATIONAL_EPROCESS
          path: /tmp/HGMF_HG44_CONFORMATIONAL_EPROCESS.zip
          if-no-files-found: error
          retention-days: 30
