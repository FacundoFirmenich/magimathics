<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<rect width="1400" height="700" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:bold}.h{font-size:19px;font-weight:bold}.b{font-size:15px}.small{font-size:13px}.box{fill:#fafafa;stroke:#222;stroke-width:1.6;rx:16}.layer{fill:#f0f0f0;stroke:#222;stroke-width:1.4;rx:12}.arrow{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#a)}.warn{fill:white;stroke:#777;stroke-width:1.5;rx:10}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#222"/></marker></defs>
<text x="700" y="42" class="title" text-anchor="middle">From recurrent motif to intervention-qualified biological unit</text>

<rect x="40" y="95" width="270" height="470" class="box"/>
<text x="175" y="130" class="h" text-anchor="middle">Candidate generation</text>
<circle cx="125" cy="235" r="34" fill="white" stroke="#222" stroke-width="2"/><circle cx="225" cy="200" r="34" fill="white" stroke="#222" stroke-width="2"/><circle cx="225" cy="300" r="34" fill="white" stroke="#222" stroke-width="2"/>
<path d="M157 224 Q185 208 191 208" class="arrow"/><path d="M225 234 V266" class="arrow"/><path d="M196 287 Q157 270 150 252" class="arrow"/>
<text x="175" y="365" class="h" text-anchor="middle">Network motif</text><text x="175" y="394" class="b" text-anchor="middle">recurrent topology</text><text x="175" y="418" class="b" text-anchor="middle">or plausible design pattern</text>
<rect x="75" y="465" width="200" height="70" class="warn"/><text x="175" y="493" class="small" text-anchor="middle">Necessary starting point</text><text x="175" y="516" class="small" text-anchor="middle">not yet a functional unit</text>

<path d="M310 330 H365" class="arrow"/>

<rect x="365" y="95" width="670" height="470" class="box"/>
<text x="700" y="130" class="h" text-anchor="middle">Biological qualification layers</text>
<rect x="410" y="165" width="580" height="62" class="layer"/><text x="700" y="192" class="h" text-anchor="middle">1 · Strict biological semantic signature</text><text x="700" y="214" class="small" text-anchor="middle">function · horizon · tolerance · continuation task</text>
<rect x="410" y="245" width="580" height="62" class="layer"/><text x="700" y="272" class="h" text-anchor="middle">2 · Kinetic / thermodynamic / spatial jurisdiction</text><text x="700" y="294" class="small" text-anchor="middle">gain · delay · cooperativity · degradation · transport · boundary conditions</text>
<rect x="410" y="325" width="580" height="62" class="layer"/><text x="700" y="352" class="h" text-anchor="middle">3 · Preservation tests</text><text x="700" y="374" class="small" text-anchor="middle">component substitution · parameter substitution · cross-substrate transport</text>
<rect x="410" y="405" width="580" height="62" class="layer"/><text x="700" y="432" class="h" text-anchor="middle">4 · Destruction tests</text><text x="700" y="454" class="small" text-anchor="middle">critical ablation · sign/source rewire · matched phenotypic decoy</text>
<rect x="410" y="485" width="580" height="62" class="layer"/><text x="700" y="512" class="h" text-anchor="middle">5 · Inclusion-minimality and evidence typing</text><text x="700" y="534" class="small" text-anchor="middle">no proper carrier retains signature · theorem/model/physical evidence kept distinct</text>

<path d="M1035 330 H1090" class="arrow"/>

<rect x="1090" y="95" width="270" height="470" class="box"/>
<text x="1225" y="130" class="h" text-anchor="middle">Adjudicated carrier</text>
<rect x="1125" y="180" width="200" height="165" class="layer"/><text x="1225" y="215" class="h" text-anchor="middle">Biological UMI</text><text x="1225" y="246" class="b" text-anchor="middle">typed relation class</text><text x="1225" y="270" class="b" text-anchor="middle">+ physical jurisdiction</text><text x="1225" y="294" class="b" text-anchor="middle">+ frozen signature</text><text x="1225" y="320" class="small" text-anchor="middle">closed · sufficient · minimal · invariant</text>
<rect x="1125" y="385" width="200" height="70" class="warn"/><text x="1225" y="413" class="h" text-anchor="middle">ABSTAIN</text><text x="1225" y="437" class="small" text-anchor="middle">if causally unresolved</text>
<rect x="1125" y="475" width="200" height="60" class="warn"/><text x="1225" y="500" class="h" text-anchor="middle">NEGATIVE</text><text x="1225" y="522" class="small" text-anchor="middle">relative to strict signature</text>

<text x="700" y="630" class="h" text-anchor="middle">Topology nominates a candidate; intervention and transport earn the status of biological unit.</text>
</svg>