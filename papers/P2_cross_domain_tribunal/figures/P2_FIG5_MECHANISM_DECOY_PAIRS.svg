<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:bold}.h{font-size:18px;font-weight:bold}.b{font-size:14px}.small{font-size:12px}.pair{fill:#fafafa;stroke:#222;stroke-width:1.4;rx:14}.pos{fill:#ededed;stroke:#111;stroke-width:1.5;rx:10}.neg{fill:white;stroke:#777;stroke-width:1.5;rx:10}.arrow{stroke:#333;stroke-width:2;marker-end:url(#a)}.x{stroke:#999;stroke-width:3}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#333"/></marker></defs>
<text x="750" y="42" class="title" text-anchor="middle">Matched phenotypes do not imply matched mechanisms</text>

<!-- Pair 1 -->
<rect x="35" y="85" width="280" height="555" class="pair"/><text x="175" y="118" class="h" text-anchor="middle">Specificity</text>
<rect x="60" y="150" width="230" height="190" class="pos"/><text x="175" y="180" class="h" text-anchor="middle">Kinetic proofreading</text><text x="175" y="210" class="b" text-anchor="middle">driven multistage progression</text><text x="175" y="234" class="b" text-anchor="middle">+ reject / reset</text><line x1="105" y1="265" x2="150" y2="265" class="arrow"/><line x1="155" y1="265" x2="200" y2="265" class="arrow"/><line x1="205" y1="265" x2="245" y2="265" class="arrow"/><text x="175" y="310" class="small" text-anchor="middle">beyond-equilibrium discrimination</text>
<rect x="60" y="385" width="230" height="190" class="neg"/><text x="175" y="415" class="h" text-anchor="middle">Equilibrium recognition</text><text x="175" y="447" class="b" text-anchor="middle">single binding readout</text><line x1="115" y1="490" x2="235" y2="490" class="arrow"/><text x="175" y="535" class="small" text-anchor="middle">can discriminate, but fails strict</text><text x="175" y="555" class="small" text-anchor="middle">beyond-equilibrium signature</text>

<!-- Pair 2 -->
<rect x="330" y="85" width="280" height="555" class="pair"/><text x="470" y="118" class="h" text-anchor="middle">Spatial stripe</text>
<rect x="355" y="150" width="230" height="190" class="pos"/><text x="470" y="180" class="h" text-anchor="middle">Turing mechanism</text><text x="470" y="210" class="b" text-anchor="middle">locally stable reaction system</text><text x="470" y="234" class="b" text-anchor="middle">+ differential transport</text><path d="M385 285 Q420 245 455 285 T525 285 T555 285" fill="none" stroke="#222" stroke-width="2"/><text x="470" y="315" class="small" text-anchor="middle">finite-k instability selects scale</text>
<rect x="355" y="385" width="230" height="190" class="neg"/><text x="470" y="415" class="h" text-anchor="middle">Instructed stripe</text><text x="470" y="447" class="b" text-anchor="middle">external morphogen gradient</text><path d="M390 500 L550 460" stroke="#777" stroke-width="2"/><rect x="440" y="475" width="60" height="35" fill="#ddd"/><text x="470" y="535" class="small" text-anchor="middle">similar output, externally positioned</text>

<!-- Pair 3 -->
<rect x="625" y="85" width="280" height="555" class="pair"/><text x="765" y="118" class="h" text-anchor="middle">Phase alignment</text>
<rect x="650" y="150" width="230" height="190" class="pos"/><text x="765" y="180" class="h" text-anchor="middle">Mutual synchronization</text><circle cx="720" cy="265" r="32" fill="white" stroke="#222" stroke-width="2"/><circle cx="810" cy="265" r="32" fill="white" stroke="#222" stroke-width="2"/><line x1="752" y1="250" x2="778" y2="250" class="arrow"/><line x1="778" y1="280" x2="752" y2="280" class="arrow"/><text x="765" y="320" class="small" text-anchor="middle">locking caused by inter-oscillator coupling</text>
<rect x="650" y="385" width="230" height="190" class="neg"/><text x="765" y="415" class="h" text-anchor="middle">Common forcing</text><circle cx="720" cy="500" r="28" fill="white" stroke="#777" stroke-width="2"/><circle cx="810" cy="500" r="28" fill="white" stroke="#777" stroke-width="2"/><circle cx="765" cy="450" r="20" fill="#ddd" stroke="#777"/><line x1="755" y1="469" x2="733" y2="478" class="arrow"/><line x1="775" y1="469" x2="797" y2="478" class="arrow"/><text x="765" y="550" class="small" text-anchor="middle">alignment without mutual relation</text>

<!-- Pair 4 -->
<rect x="920" y="85" width="280" height="555" class="pair"/><text x="1060" y="118" class="h" text-anchor="middle">Boundary localization</text>
<rect x="945" y="150" width="230" height="190" class="pos"/><text x="1060" y="180" class="h" text-anchor="middle">Topological edge transport</text><rect x="985" y="225" width="150" height="70" fill="white" stroke="#222" stroke-width="2"/><line x1="990" y1="240" x2="1130" y2="240" stroke="#222" stroke-width="6"/><text x="1060" y="320" class="small" text-anchor="middle">bulk invariant + gap/symmetry + boundary</text>
<rect x="945" y="385" width="230" height="190" class="neg"/><text x="1060" y="415" class="h" text-anchor="middle">Trivial defect mode</text><rect x="985" y="455" width="150" height="70" fill="white" stroke="#777" stroke-width="2"/><circle cx="1060" cy="490" r="16" fill="#bbb"/><text x="1060" y="550" class="small" text-anchor="middle">localized, but not bulk-protected</text>

<!-- Pair 5 -->
<rect x="1215" y="85" width="250" height="555" class="pair"/><text x="1340" y="118" class="h" text-anchor="middle">Catalytic production</text>
<rect x="1235" y="150" width="210" height="190" class="pos"/><text x="1340" y="180" class="h" text-anchor="middle">Minimal RAF closure</text><circle cx="1290" cy="255" r="27" fill="white" stroke="#222"/><circle cx="1390" cy="255" r="27" fill="white" stroke="#222"/><line x1="1317" y1="245" x2="1363" y2="245" class="arrow"/><line x1="1363" y1="275" x2="1317" y2="275" class="arrow"/><text x="1340" y="320" class="small" text-anchor="middle">food-generated + internally catalyzed</text>
<rect x="1235" y="385" width="210" height="190" class="neg"/><text x="1340" y="415" class="h" text-anchor="middle">Open catalytic chain</text><circle cx="1275" cy="495" r="22" fill="white" stroke="#777"/><circle cx="1340" cy="495" r="22" fill="white" stroke="#777"/><circle cx="1405" cy="495" r="22" fill="white" stroke="#777"/><line x1="1297" y1="495" x2="1318" y2="495" class="arrow"/><line x1="1362" y1="495" x2="1383" y2="495" class="arrow"/><text x="1340" y="550" class="small" text-anchor="middle">external catalytic dependence remains</text>

<text x="750" y="690" class="h" text-anchor="middle">Strict signatures and interventions separate mechanism class from output resemblance.</text>
</svg>