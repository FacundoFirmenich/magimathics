name: P2 clean paper build

on:
  push:
    branches:
      - paper-p2-cross-domain-umi-tribunal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk texlive-latex-extra texlive-fonts-recommended inkscape

      - name: Build P2 PDF and arXiv package
        working-directory: papers/P2_cross_domain_tribunal/latex
        run: |
          chmod +x build.sh arxiv_pack.sh
          ./arxiv_pack.sh

      - name: Verify receipts
        working-directory: papers/P2_cross_domain_tribunal/latex
        run: |
          grep -q '^PASS_P2_LATEX_BUILD' BUILD_RECEIPT.txt
          grep -q '^PASS_P2_ARXIV_PACKAGE' ARXIV_PACKAGE_RECEIPT.txt
          test -s main.pdf
          test -s P2_ARXIV_SOURCE.tar.gz
          sha256sum -c BUILD_SHA256SUMS.txt

      - name: Upload P2 production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P2-production-build
          path: |
            papers/P2_cross_domain_tribunal/latex/main.pdf
            papers/P2_cross_domain_tribunal/latex/P2_ARXIV_SOURCE.tar.gz
            papers/P2_cross_domain_tribunal/latex/BUILD_RECEIPT.txt
            papers/P2_cross_domain_tribunal/latex/ARXIV_PACKAGE_RECEIPT.txt
            papers/P2_cross_domain_tribunal/latex/BUILD_SHA256SUMS.txt
            papers/P2_cross_domain_tribunal/latex/ARXIV_PACKAGE_SHA256SUMS.txt
          if-no-files-found: error
