name: P2b clean paper build

on:
  push:
    branches:
      - paper-p2b-biology-umi-tribunal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk texlive-latex-extra texlive-fonts-recommended inkscape

      - name: Build P2b PDF and bioRxiv package
        working-directory: papers/P2b_biology_umi/latex
        run: |
          chmod +x build.sh biorxiv_pack.sh
          ./biorxiv_pack.sh

      - name: Verify receipts
        working-directory: papers/P2b_biology_umi/latex
        run: |
          grep -q '^PASS_P2B_LATEX_BUILD' BUILD_RECEIPT.txt
          grep -q '^PASS_P2B_BIORXIV_PACKAGE' BIORXIV_PACKAGE_RECEIPT.txt
          test -s main.pdf
          test -s P2B_BIORXIV_SOURCE.tar.gz
          sha256sum -c BUILD_SHA256SUMS.txt

      - name: Upload P2b production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P2b-production-build
          path: |
            papers/P2b_biology_umi/latex/main.pdf
            papers/P2b_biology_umi/latex/P2B_BIORXIV_SOURCE.tar.gz
            papers/P2b_biology_umi/latex/BUILD_RECEIPT.txt
            papers/P2b_biology_umi/latex/BIORXIV_PACKAGE_RECEIPT.txt
            papers/P2b_biology_umi/latex/BUILD_SHA256SUMS.txt
            papers/P2b_biology_umi/latex/BIORXIV_PACKAGE_SHA256SUMS.txt
          if-no-files-found: error
