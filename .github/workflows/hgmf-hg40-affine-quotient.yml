name: HGMF HG40 affine quotient identifiability

on:
  push:
    branches:
      - hgmf-hg40-affine-quotient-identifiability-20261110
    paths:
      - 'research/hgmf-hg40/hgmf_hg40_affine_quotient.py'
      - 'research/hgmf-hg40/analyze_magnetic_affine_quotient.py'
      - 'research/hgmf-hg40/analyze_adsorption_reference_free.py'
      - 'research/hgmf-hg40/hgmf_hg40_exact_verify.py'
      - '.github/workflows/hgmf-hg40-affine-quotient.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  affine-quotient-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout magimathics
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy h5py matplotlib

      - name: Fetch pinned public source repositories
        run: |
          mkdir -p external

          git init external/FGT_CrSBr
          git -C external/FGT_CrSBr remote add origin https://github.com/sadityakr/EB-in-FGT_CrSBr-vdW-heterostructure.git
          git -C external/FGT_CrSBr fetch --depth 1 origin 66662e8aa3690cebaaef52dfc4ddd3bea458a576
          git -C external/FGT_CrSBr checkout FETCH_HEAD
          test "$(git -C external/FGT_CrSBr rev-parse HEAD)" = "66662e8aa3690cebaaef52dfc4ddd3bea458a576"

          git init external/AJBrown
          git -C external/AJBrown remote add origin https://github.com/NIST-ISODB/AJBrownThesisIsotherms.git
          git -C external/AJBrown fetch --depth 1 origin 17a48e5d3c00e97387d0dfb1e280d8d6bf103d40
          git -C external/AJBrown checkout FETCH_HEAD
          test "$(git -C external/AJBrown rev-parse HEAD)" = "17a48e5d3c00e97387d0dfb1e280d8d6bf103d40"

      - name: Execute magnetic shared-affine quotient audit
        run: |
          rm -rf research/hgmf-hg40/generated
          mkdir -p research/hgmf-hg40/generated
          PYTHONPATH=research/hgmf-hg40 python research/hgmf-hg40/analyze_magnetic_affine_quotient.py \
            --source-root external/FGT_CrSBr \
            --out-dir research/hgmf-hg40/generated \
            | tee research/hgmf-hg40/generated/HGMF_HG40_MAGNETIC_STDOUT.json

      - name: Execute adsorption reference-free quotient audit
        run: |
          PYTHONPATH=research/hgmf-hg40 python research/hgmf-hg40/analyze_adsorption_reference_free.py \
            --csv external/AJBrown/Scanning_Isotherms/xe_scanning_isotherms.csv \
            --out-dir research/hgmf-hg40/generated \
            | tee research/hgmf-hg40/generated/HGMF_HG40_ADSORPTION_STDOUT.json

      - name: Execute exact gate verifier
        run: |
          PYTHONPATH=research/hgmf-hg40 python research/hgmf-hg40/hgmf_hg40_exact_verify.py \
            | tee research/hgmf-hg40/generated/HGMF_HG40_VERIFY_OUTPUT.txt

      - name: Build execution receipt and bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root=Path('research/hgmf-hg40/generated')
          receipt={
            'gate':'HGMF-HG40',
            'branch':'hgmf-hg40-affine-quotient-identifiability-20261110',
            'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'sources':{
              'magnetism':'sadityakr/EB-in-FGT_CrSBr-vdW-heterostructure@66662e8aa3690cebaaef52dfc4ddd3bea458a576',
              'adsorption':'NIST-ISODB/AJBrownThesisIsotherms@17a48e5d3c00e97387d0dfb1e280d8d6bf103d40'
            },
            'files':[]
          }
          for p in sorted(root.iterdir()):
            if p.is_file():
              receipt['files'].append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'HGMF_HG40_EXECUTION_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cd research/hgmf-hg40
          find generated -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > generated/SHA256SUMS.txt
          zip -r HGMF_HG40_AFFINE_QUOTIENT.zip generated hgmf_hg40_affine_quotient.py analyze_magnetic_affine_quotient.py analyze_adsorption_reference_free.py hgmf_hg40_exact_verify.py

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: HGMF_HG40_AFFINE_QUOTIENT
          path: research/hgmf-hg40/HGMF_HG40_AFFINE_QUOTIENT.zip
          if-no-files-found: error
          retention-days: 30
